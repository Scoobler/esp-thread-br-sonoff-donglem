name: Build Sonoff Dongle-M OTBR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/donglem-network-led
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Dongle-M firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.6

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Validate approved GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail

          unapproved=()
          while IFS= read -r workflow; do
            case "${workflow}" in
              .github/workflows/build_dongle_m.yml|.github/workflows/check_upstream.yml)
                ;;
              *)
                unapproved+=("${workflow}")
                ;;
            esac
          done < <(git ls-files -- .github/workflows/)

          if (( ${#unapproved[@]} > 0 )); then
            for workflow in "${unapproved[@]}"; do
              echo "::error::Unapproved GitHub Actions workflow: ${workflow}"
            done
            echo "Approved workflow files: build_dongle_m.yml, check_upstream.yml"
            exit 1
          fi

          echo "Approved GitHub Actions workflow allowlist validated."

      - name: Validate non-destructive upgrade packager
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/release/tests -p 'test_*.py' -v

      - name: Build Dongle-M firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router
          idf.py -B build-sonoff-dongle-m \
            -D SDKCONFIG=sdkconfig.sonoff_dongle_m \
            -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.sonoff_dongle_m \
            build

      - name: Create merged flash image
        shell: bash
        run: |
          source /opt/esp/idf/export.sh

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            FIRMWARE_NAME="sonoff-dongle-m-otbr-${GITHUB_REF_NAME}.bin"
          else
            FIRMWARE_NAME="sonoff-dongle-m-otbr-ci.bin"
          fi

          python3 tools/release/merge_dongle_m_image.py \
            examples/basic_thread_border_router/build-sonoff-dongle-m \
            --output "artifacts/${FIRMWARE_NAME}"

      - name: Create persistent-settings-preserving USB upgrade image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            UPGRADE_NAME="sonoff-dongle-m-otbr-${GITHUB_REF_NAME}-upgrade.bin"
          else
            UPGRADE_NAME="sonoff-dongle-m-otbr-ci-upgrade.bin"
          fi
          python3 tools/release/create_upgrade_image.py \
            examples/basic_thread_border_router/build-sonoff-dongle-m \
            --output "artifacts/${UPGRADE_NAME}"

      - name: Show firmware checksums
        shell: bash
        run: |
          ls -lh artifacts/*.bin artifacts/*.sha256
          cat artifacts/*.sha256

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: |
            artifacts/*.bin
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged firmware release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: artifacts

      - name: Validate release notes
        id: release_notes
        shell: bash
        run: |
          RELEASE_NOTES="docs/releases/${GITHUB_REF_NAME}.md"

          if [[ ! -f "${RELEASE_NOTES}" ]]; then
            echo "::error::Missing release notes: ${RELEASE_NOTES}"
            echo
            echo "Tagged releases require a version-specific GitHub Release body."
            echo "Create ${RELEASE_NOTES} before pushing the release tag."
            exit 1
          fi

          if [[ ! -s "${RELEASE_NOTES}" ]]; then
            echo "::error::Release notes file is empty: ${RELEASE_NOTES}"
            exit 1
          fi

          echo "path=${RELEASE_NOTES}" >> "${GITHUB_OUTPUT}"

          echo "Using release notes:"
          echo "  ${RELEASE_NOTES}"
          echo
          cat "${RELEASE_NOTES}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            artifacts/*.bin
            artifacts/*.sha256
          fail_on_unmatched_files: true

  pages:
    name: Publish browser flasher to GitHub Pages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out flasher site
        uses: actions/checkout@v5

      - name: Download release firmware from this workflow
        uses: actions/download-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: artifacts

      - name: Assemble GitHub Pages release site
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -r site/flasher/. dist/
          cp artifacts/*.bin dist/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          dist = Path("dist")
          images = {
              "full": (f"sonoff-dongle-m-otbr-{tag}.bin", 0),
              "upgrade": (f"sonoff-dongle-m-otbr-{tag}-upgrade.bin", 0x20000),
          }
          manifest = {"version": tag}
          for key, (filename, offset) in images.items():
              path = dist / filename
              if not path.is_file():
                  raise SystemExit(f"Required release image missing: {filename}")
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = (Path("artifacts") / (filename + ".sha256")).read_text().split()[0]
              if sha != expected:
                  raise SystemExit(f"Checksum mismatch for {filename}")
              manifest[key] = {"file": filename, "offset": offset, "sha256": sha}
          (dist / "firmware.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

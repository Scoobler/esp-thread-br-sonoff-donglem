name: Build Sonoff Dongle-M OTBR

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/donglem-network-led
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Dongle-M firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Dongle-M firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          cd examples/basic_thread_border_router
          idf.py -B build-sonoff-dongle-m \
            -D SDKCONFIG=sdkconfig.sonoff_dongle_m \
            -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.sonoff_dongle_m \
            build

      - name: Create merged flash image
        shell: bash
        run: |
          source /opt/esp/idf/export.sh

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            FIRMWARE_NAME="sonoff-dongle-m-otbr-${GITHUB_REF_NAME}.bin"
          else
            FIRMWARE_NAME="sonoff-dongle-m-otbr-ci.bin"
          fi

          python3 tools/release/merge_dongle_m_image.py \
            examples/basic_thread_border_router/build-sonoff-dongle-m \
            --output "artifacts/${FIRMWARE_NAME}"

      - name: Show firmware checksums
        shell: bash
        run: |
          ls -lh artifacts/*.bin artifacts/*.sha256
          cat artifacts/*.sha256

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: |
            artifacts/*.bin
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged firmware release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonoff-dongle-m-firmware
          path: artifacts

      - name: Validate release notes
        id: release_notes
        shell: bash
        run: |
          RELEASE_NOTES="docs/releases/${GITHUB_REF_NAME}.md"

          if [[ ! -f "${RELEASE_NOTES}" ]]; then
            echo "::error::Missing release notes: ${RELEASE_NOTES}"
            echo
            echo "Tagged releases require a version-specific GitHub Release body."
            echo "Create ${RELEASE_NOTES} before pushing the release tag."
            exit 1
          fi

          if [[ ! -s "${RELEASE_NOTES}" ]]; then
            echo "::error::Release notes file is empty: ${RELEASE_NOTES}"
            exit 1
          fi

          echo "path=${RELEASE_NOTES}" >> "${GITHUB_OUTPUT}"

          echo "Using release notes:"
          echo "  ${RELEASE_NOTES}"
          echo
          cat "${RELEASE_NOTES}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.release_notes.outputs.path }}
          files: |
            artifacts/*.bin
            artifacts/*.sha256
          fail_on_unmatched_files: true
